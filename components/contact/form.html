<div class="container">
    <div class="section-title">
      <h2 data-i18n>Contacto</h2>
      <p data-i18n>¿Tienes un proyecto? Hablemos.</p>
    </div>
 
    <form class="contact-form" id="contactForm"
      hx-post="/api/components/contact"
      hx-target="#formFeedback"
      hx-swap="innerHTML"
      hx-disabled-elt="find button[type=submit]"
      hx-indicator="#submitBtn">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADrARkx82ejIe8Hi"></div>
      <div class="form-group">
        <label for="name" data-i18n>Nombre</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" data-i18n-attr="placeholder" required />
      </div>
      <div class="form-group">
        <label for="email" data-i18n>Email</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" data-i18n-attr="placeholder" required />
      </div>
      <div class="form-group">
        <label for="message" data-i18n>Mensaje</label>
        <textarea id="message" name="message" rows="5" placeholder="Cuéntame tu proyecto..." data-i18n-attr="placeholder" required></textarea>
      </div>
      <button type="submit" class="btn" id="submitBtn" data-i18n>Enviar mensaje</button>
      <div id="formFeedback"></div>
    </form>
</div>
<script>
  let turnstileApiReady = false;
  let turnstilePending = false;

  window.onTurnstileLoad = function () {
    turnstileApiReady = true;
    if (turnstilePending) renderTurnstile();
  };

  function renderTurnstile() {
    const el = document.querySelector('.cf-turnstile:not([data-rendered])');
    if (!el) return;
    if (!turnstileApiReady || !window.turnstile) {
      turnstilePending = true; // esperar a que cargue la API
      return;
    }
    el.setAttribute('data-rendered', 'true');
    turnstile.render(el, { sitekey: el.dataset.sitekey });
  }

  document.body.addEventListener('htmx:afterSwap', renderTurnstile);
</script>
