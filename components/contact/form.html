<div class="container">
    <div class="section-title">
      <h2 data-i18n>Contacto</h2>
      <p data-i18n>¿Tienes un proyecto? Hablemos.</p>
    </div>
 
    <form class="contact-form" id="contactForm"
      hx-post="/api/components/contact"
      hx-target="#formFeedback"
      hx-swap="innerHTML"
      hx-disabled-elt="find button[type=submit]"
      hx-indicator="#submitBtn">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADrARkx82ejIe8Hi"></div>
      <div class="form-group">
        <label for="name" data-i18n>Nombre</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" data-i18n-attr="placeholder" required />
      </div>
      <div class="form-group">
        <label for="email" data-i18n>Email</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" data-i18n-attr="placeholder" required />
      </div>
      <div class="form-group">
        <label for="message" data-i18n>Mensaje</label>
        <textarea id="message" name="message" rows="5" placeholder="Cuéntame tu proyecto..." data-i18n-attr="placeholder" required></textarea>
      </div>
      <div class="form-group privacy-check">
        <label for="privacy">
          <input type="checkbox" id="privacy" name="privacy" value="on" required />
          <span>Acepto la <a href="/privacidad.html" target="_blank" rel="noopener">política de privacidad</a></span>
        </label>
      </div>
      <button type="submit" class="btn" id="submitBtn" data-i18n>Enviar mensaje</button>
      <div id="formFeedback"></div>
    </form>
</div>
<script>
  let turnstileApiReady = false;
  let turnstilePending = false;

  window.onTurnstileLoad = function () {
    turnstileApiReady = true;
    if (turnstilePending) renderTurnstile();
  };

  function renderTurnstile() {
    const el = document.querySelector('.cf-turnstile:not([data-rendered])');
    if (!el) return;
    if (!turnstileApiReady || !window.turnstile) {
      turnstilePending = true; // esperar a que cargue la API
      return;
    }
    el.setAttribute('data-rendered', 'true');
    turnstile.render(el, { sitekey: el.dataset.sitekey });
  }

  document.body.addEventListener('htmx:afterSwap', renderTurnstile);
</script>
<script>
  // WebMCP: expone el formulario de contacto como herramienta para agentes de IA.
  // Rellena los campos y lleva el foco al formulario; no envía, no marca la
  // casilla de privacidad ni completa Turnstile (eso lo hace el usuario).
  (function () {
    var mc = document.modelContext;
    if (!mc || typeof mc.registerTool !== 'function') return;
    if (window.__contactWebMcpRegistered) return;
    window.__contactWebMcpRegistered = true;

    mc.registerTool({
      name: 'fill_contact_form',
      description: 'Rellena el formulario de contacto con nombre, correo y mensaje, y lleva el foco al formulario para que el usuario lo revise. No envía el formulario ni marca la casilla de privacidad: el usuario debe aceptarla, completar la verificación de seguridad y pulsar Enviar.',
      inputSchema: {
        type: 'object',
        additionalProperties: false,
        properties: {
          name: { type: 'string', description: 'Nombre de la persona', maxLength: 120 },
          email: { type: 'string', format: 'email', description: 'Correo electrónico de contacto', maxLength: 254 },
          message: { type: 'string', description: 'Mensaje para el formulario de contacto', maxLength: 4000 }
        },
        required: ['name', 'email', 'message']
      },
      annotations: {
        readOnlyHint: false,
        consequentialHint: false,
        untrustedContentHint: true
      },
      execute: async function (input) {
        var form = document.getElementById('contactForm');
        var nameField = document.getElementById('name');
        var emailField = document.getElementById('email');
        var messageField = document.getElementById('message');
        if (!form || !nameField || !emailField || !messageField) {
          return 'El formulario de contacto no está disponible en esta página.';
        }
        var name = String(input.name || '').trim();
        var email = String(input.email || '').trim();
        var message = String(input.message || '').trim();
        if (!name || name.length > 120) return 'Falta un nombre válido (1-120 caracteres).';
        if (!email || email.length > 254) return 'Falta un correo válido (hasta 254 caracteres).';
        if (!message || message.length > 4000) return 'Falta un mensaje válido (hasta 4000 caracteres).';

        nameField.value = name;
        emailField.value = email;
        messageField.value = message;
        if (!emailField.checkValidity()) return 'El correo proporcionado no es válido.';

        var contactSection = document.getElementById('contact');
        if (contactSection) {
          contactSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          form.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return 'Formulario rellenado. El usuario debe revisar los datos, aceptar la política de privacidad, completar la verificación de seguridad y pulsar Enviar.';
      }
    }).catch(function () {});
  })();
</script>
