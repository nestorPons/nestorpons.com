<header>
  <div class="container">
    <nav id="main-menu">
      <div class="logo">Néstor<span>Pons</span>.com</div>

      <div class="menu">
        <a href="#about" data-i18n>Perfil</a>
        <a href="#chat" data-i18n>Asistente</a>
        <a href="#projects" data-i18n>Proyectos</a>
        <a href="#experience" data-i18n>Experiencia</a>
        <a href="#skills" data-i18n>Tecnologías</a>
        <a href="#contact" data-i18n>Contacto</a>
        <!-- Switcher de Idiomas -->
        <div
          id="lang-switch"
          class="lang-switch"
          aria-label="Seleccionar idioma"
        >
          <button type="button" class="lang-toggle" aria-expanded="false">
            <i class="fa-solid fa-globe"></i>
            <span data-i18n>Idioma</span>
            <i
              class="fa-solid fa-chevron-down"
              style="font-size: 0.8em"
            ></i>
          </button>

          <div class="lang-dropdown">
            <button
              type="button"
              class="lang-btn active"
              onclick="setLanguage('es')"
            >
              ES - Español
            </button>
            <button
              type="button"
              class="lang-btn"
              onclick="setLanguage('en')"
            >
              EN - English
            </button>
            <button
              type="button"
              class="lang-btn"
              onclick="setLanguage('pt')"
            >
              PT - Português
            </button>
            <button
              type="button"
              class="lang-btn"
              onclick="setLanguage('fr')"
            >
              FR - Français
            </button>
            <button
              type="button"
              class="lang-btn"
              onclick="setLanguage('de')"
            >
              DE - Deutsch
            </button>
            <button
              type="button"
              class="lang-btn"
              onclick="setLanguage('it')"
            >
              IT - Italiano
            </button>
          </div>
        </div>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </div>
</header>
