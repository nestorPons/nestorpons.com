<div class="skills-wheel" id="skills-wheel">
  <div class="wheel-stage">
    <div class="wheel-rotor" id="wheel-rotor">
      <svg class="wheel-svg" viewBox="0 0 520 520" role="presentation">
        <defs>
          <marker id="whArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z"></path>
          </marker>
        </defs>
        <circle class="wheel-guide" cx="260" cy="260" r="220"></circle>
        {{range $i, $g := .}}
        <path class="wheel-arc{{if eq $i 0}} is-active{{end}}" d="{{$g.Arc}}" marker-end="url(#whArrow)"></path>
        <text class="wheel-label{{if eq $i 0}} is-active{{end}}" x="{{$g.LabelX}}" y="{{$g.LabelY}}" transform="rotate({{$g.LabelRot}} {{$g.LabelX}} {{$g.LabelY}})" text-anchor="middle" dominant-baseline="middle">{{$g.Group}}</text>
        {{end}}
      </svg>
    </div>
    <div class="wheel-core">
      {{range $i, $g := .}}
      <article class="core-panel{{if eq $i 0}} is-active{{end}}" data-panel="{{$i}}">
        <h3 class="core-title">{{$g.Group}}</h3>
        <ul class="core-list">
          {{range $g.Items}}
          <li class="core-item">
            <i class="{{.Icon}}"></i>
            <span class="core-text">
              <strong>{{.Name}}</strong>
              <em>{{.Use}}</em>
            </span>
            {{if .Badge}}<span class="core-badge">{{.Badge}}</span>{{end}}
          </li>
          {{end}}
        </ul>
      </article>
      {{end}}
    </div>
  </div>
  <div class="wheel-controls">
    <div class="wheel-dots">
      {{range $i, $g := .}}
      <button type="button" class="wheel-dot{{if eq $i 0}} is-active{{end}}" data-idx="{{$i}}" aria-label="{{$g.Group}}"></button>
      {{end}}
    </div>
    <button type="button" class="wheel-toggle" id="wheel-toggle" aria-label="Pausar rotación">
      <i class="fa-solid fa-pause" aria-hidden="true"></i>
    </button>
  </div>
  <p class="wheel-hint" data-i18n>La rueda gira sola · pausa o reanuda cuando quieras</p>
</div>

<style>
.skills-wheel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 10px 0;
}

.wheel-stage {
    position: relative;
    width: min(92vw, 700px);
    aspect-ratio: 1 / 1;
}

.wheel-rotor {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    will-change: transform;
}

.wheel-svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
}

.wheel-guide {
    fill: none;
    stroke: rgba(255, 255, 255, 0.05);
    stroke-width: 1;
    stroke-dasharray: 2 6;
}

.wheel-arc {
    fill: none;
    stroke: rgba(59, 227, 139, 0.28);
    stroke-width: 2.5;
    stroke-linecap: round;
    transition: stroke 0.4s ease, stroke-width 0.4s ease, filter 0.4s ease;
}

.wheel-arc.is-active {
    stroke: var(--accent);
    stroke-width: 4;
    filter: drop-shadow(0 0 6px rgba(59, 227, 139, 0.6));
}

#whArrow path {
    fill: var(--accent);
    opacity: 0.6;
}

.wheel-label {
    fill: var(--muted);
    font-family: var(--font-family-heading);
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 6px;
    stroke-linejoin: round;
    transition: fill 0.4s ease;
    pointer-events: none;
}

.wheel-label.is-active {
    fill: var(--accent);
}

.wheel-core {
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, rgba(16, 37, 61, 0.92), rgba(8, 19, 32, 0.94));
    border: 1px solid var(--border);
    box-shadow: inset 0 0 50px rgba(59, 227, 139, 0.05);
    overflow: hidden;
}

.core-panel {
    position: absolute;
    inset: 0;
    padding: 19% 13%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    opacity: 0;
    transform: scale(0.94);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
    overflow: auto;
    scrollbar-width: none;
}

.core-panel::-webkit-scrollbar { display: none; }

.core-panel.is-active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}

.core-title {
    font-family: var(--font-family-heading);
    font-size: 1.5rem;
    letter-spacing: 0.6px;
    color: var(--accent);
    margin: 0;
}

.core-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
}

.core-item {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
}

.core-item i {
    color: var(--accent);
    font-size: 1rem;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
}

.core-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.core-text strong {
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.2;
}

.core-text em {
    font-style: normal;
    font-size: 0.85rem;
    line-height: 1.3;
    color: var(--muted);
}

.core-badge {
    font-size: 0.68rem;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 50px;
    padding: 2px 8px;
    white-space: nowrap;
    flex-shrink: 0;
}

.wheel-controls {
    display: flex;
    align-items: center;
    gap: 18px;
}

.wheel-dots {
    display: flex;
    gap: 10px;
}

.wheel-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.wheel-dot.is-active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent);
}

.wheel-toggle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(16, 37, 61, 0.55);
    color: var(--accent);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}

.wheel-toggle:hover {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(59, 227, 139, 0.35);
}

.wheel-toggle:active {
    transform: scale(0.94);
}

.wheel-hint {
    margin: 0;
    font-size: 0.85rem;
    letter-spacing: 0.3px;
    color: var(--muted);
    opacity: 0.7;
    text-align: center;
}

@media (max-width: 640px) {
    .wheel-label { font-size: 12px; }
    .core-panel { padding: 20% 15%; }
    .core-title { font-size: 1.2rem; }
    .core-text strong { font-size: 0.85rem; }
    .core-text em { font-size: 0.75rem; }
    .core-item i { font-size: 0.9rem; }
}
</style>

<script>
(function () {
    var root = document.getElementById('skills-wheel');
    if (!root || root.dataset.ready === '1') return;
    root.dataset.ready = '1';

    var rotor = root.querySelector('#wheel-rotor');
    var toggle = root.querySelector('#wheel-toggle');
    var toggleIcon = toggle ? toggle.querySelector('i') : null;
    var panels = Array.prototype.slice.call(root.querySelectorAll('.core-panel'));
    var dots = Array.prototype.slice.call(root.querySelectorAll('.wheel-dot'));
    var arcs = Array.prototype.slice.call(root.querySelectorAll('.wheel-arc'));
    var labels = Array.prototype.slice.call(root.querySelectorAll('.wheel-label'));
    var n = panels.length;
    if (!n) return;

    var step = 360 / n;
    var SPEED = 360 / 26000; // grados por ms -> vuelta completa en 26s (lento)
    var angle = 0;
    var activeIdx = -1;
    var spinning = true;
    var last = null;
    var rafId = null;

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) spinning = false;

    function setActive(i) {
        panels.forEach(function (p, k) { p.classList.toggle('is-active', k === i); });
        dots.forEach(function (d, k) { d.classList.toggle('is-active', k === i); });
        arcs.forEach(function (a, k) { a.classList.toggle('is-active', k === i); });
        labels.forEach(function (l, k) { l.classList.toggle('is-active', k === i); });
    }

    function updateToggle() {
        if (!toggle) return;
        toggle.setAttribute('aria-label', spinning ? 'Pausar rotación' : 'Reanudar rotación');
        if (toggleIcon) toggleIcon.className = spinning ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    }

    function frame(t) {
        if (last === null) last = t;
        var dt = t - last;
        last = t;
        if (dt > 250) dt = 250; // evita saltos tras pestaña inactiva
        if (spinning) {
            angle = (angle + SPEED * dt) % 360;
        }
        rotor.style.transform = 'rotate(' + angle + 'deg)';
        var idx = ((Math.round(-angle / step) % n) + n) % n;
        if (idx !== activeIdx) {
            activeIdx = idx;
            setActive(idx);
        }
        rafId = requestAnimationFrame(frame);
    }

    function setSpinning(on) {
        spinning = on;
        last = null;
        updateToggle();
    }

    if (toggle) {
        toggle.addEventListener('click', function () { setSpinning(!spinning); });
    }

    dots.forEach(function (d) {
        d.addEventListener('click', function () {
            var i = parseInt(d.dataset.idx, 10) || 0;
            var target = ((-i * step) % 360 + 360) % 360;
            var current = ((angle % 360) + 360) % 360;
            angle += ((target - current) % 360 + 360) % 360;
            rotor.style.transform = 'rotate(' + angle + 'deg)';
            activeIdx = i;
            setActive(i);
            setSpinning(false);
        });
    });

    updateToggle();
    setActive(0);
    activeIdx = 0;
    rafId = requestAnimationFrame(frame);
})();
</script>
